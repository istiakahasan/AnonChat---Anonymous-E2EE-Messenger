[workspace]
resolver = "2"
members = [
    "crates/anonchat-crypto",
    "crates/anonchat-server",
    "crates/anonchat-client",
    "crates/anonchat-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["AnonChat Contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Cryptography
x25519-dalek = { version = "2.0", features = ["static_secrets", "serde"] }
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
subtle = "2.5"
rand = "0.8"
rand_core = { version = "0.6", features = ["std"] }
zeroize = { version = "1.7", features = ["zeroize_derive"] }
secrecy = { version = "0.8", features = ["serde"] }

# Serialization & Utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
hex = "0.4"
thiserror = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }

# Async & Networking
tokio = { version = "1.37", features = ["full"] }
tokio-stream = "0.1"
reqwest = { version = "0.12", features = ["json", "socks"] }
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "sqlite", "chrono", "uuid"] }
rusqlite = { version = "0.31", features = ["bundled-sqlcipher"] }

# UI & Tor
eframe = "0.27"
egui = "0.27"
qrcode = "0.14"
arti-client = { version = "0.15", optional = true }
tor-rtcompat = { version = "0.15", optional = true }

