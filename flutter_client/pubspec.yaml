name: anonchat_flutter
description: "AnonChat Flutter client integrating libsignal ^2.3.0 with Post-Quantum Kyber and Sealed Sender"
version: 1.0.0+1
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  libsignal: ^2.3.0
  cryptography: ^2.7.0
  crypto: ^3.0.3
  flutter_secure_storage: ^9.0.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

